<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>35 ANS</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<header>

    <h1>
        🌍 Petit Jeu pour tes 35 ANS
    </h1>

</header>



<main>


    <!-- ECRAN DE DEMARRAGE -->

    <div id="startScreen" class="startScreen">


        <h2>
            Coucou Maman 👋 Comme tu es joueuse tu vas devoir commencer par réfléchir !
        </h2>


        <p>
            🌍 Pars à la découverte de ton weekend !
        </p>


        <button id="startButton">

            ▶️ START

        </button>


    </div>





    <!-- ZONE CHATBOT -->

    <div id="chat" class="chat" style="display:none;">


    </div>





    <!-- ZONE IMAGE INDICE -->

    <div id="imageZone"
         class="imageZone"
         style="display:none;">


        <img
        id="indiceImage"
        src=""
        alt="Indice image">


    </div>





    <!-- ZONE SAISIE -->

    <div id="inputZone" class="inputZone">


        <input
        id="message"
        type="text"
        placeholder="Écris ta réponse..."
        autocomplete="off">



        <button id="send">

            Envoyer

        </button>


    </div>




</main>





<!-- LES BOUTONS INDICE ET SUIVANT SERONT AJOUTES ICI -->

<footer id="gameButtons">

    <button id="indiceButton" style="display:none;">
        💡 Indice
    </button>

    <button id="nextButton" style="display:none;">
        ➡️ Énigme suivante
    </button>

</footer>





<!-- CHARGEMENT DES PROGRAMMES -->


<script src="data.js"></script>

<script src="ia.js"></script>

<script src="script.js"></script>



</body>
</html>
